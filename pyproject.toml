[project]
name = "proxopt"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["torch>=2.4", "numpy", "matplotlib>=3.9", "marimo>=0.25"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-timeout>=2", "ruff"]
olmo = ["transformers>=4.48", "datasets>=3.0", "accelerate>=1.0", "pyyaml>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/proxopt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: trains default configs, runs notebooks, or needs a model"]
addopts = "-m 'not slow'"
